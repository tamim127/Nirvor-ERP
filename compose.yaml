name: nirvor-foundation
services:
  postgres:
    image: postgres:18.7-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup:local first}
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./.local/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 20s
volumes:
  postgres_data:
